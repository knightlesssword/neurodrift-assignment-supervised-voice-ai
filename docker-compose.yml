services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      # 7880/tcp: signalling (WebSocket + HTTP API + tokens verify here)
      - "7880:7880"
      # 7881/tcp: RTC TCP fallback (when UDP blocked; ICE-TCP / TURN-TCP path)
      - "7881:7881"
      # 50000-50100/udp: WebRTC media (SRTP/SRTCP Opus audio, ICE host/srflx)
      - "50000-50010:50000-50010/udp"
      # 3478/udp: embedded TURN/UDP relay (+STUN). Host-reachable relay path
      # for Docker Desktop, where container IPs are not directly routable.
      - "3478:3478/udp"
    # NB: node advertisement is set via rtc.node_ip in livekit.yaml.
    # (LIVEKIT_NODE_IP is not a real LiveKit env var — see config.go flag names.)
# NOTE: Ollama runs natively (Ollama.app) on 11434 — no container here
# to avoid port clash. Backend uses OPENROUTER_* when set, else OLLAMA_*.
