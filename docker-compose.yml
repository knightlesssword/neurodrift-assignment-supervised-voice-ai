services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      # 7880/tcp: signalling (WebSocket + HTTP API + tokens verify here)
      - "7880:7880"
      # 7881/tcp: RTC TCP fallback (when UDP blocked; ICE-TCP / TURN-TCP path)
      - "7881:7881"
      # 50000-50100/udp: WebRTC media (SRTP/SRTCP Opus audio, ICE host/srflx)
      - "50000-50010:50000-50010/udp"
      # 3478/udp: embedded TURN/UDP relay (+STUN). Host-reachable relay path
      # for Docker Desktop, where container IPs are not directly routable.
      - "3478:3478/udp"
    # NB: node advertisement is set via rtc.node_ip in livekit.yaml.
    # (LIVEKIT_NODE_IP is not a real LiveKit env var — see config.go flag names.)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      # Inside the compose network, LiveKit is reachable by service name;
      # Ollama stays native on the Mac (host.docker.internal from containers).
      # Browsers get PUBLIC_LIVEKIT_URL (host-mapped); server-side API calls
      # (dispatch, egress) use the internal LIVEKIT_URL.
      LIVEKIT_URL: ws://livekit:7880
      PUBLIC_LIVEKIT_URL: ws://localhost:7880
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      # Shared SQLite file (WAL mode): backend + worker on the same host file.
      - ./data:/data
    ports:
      # 8000/tcp: FastAPI (agents/calls API, Swagger, plain-JS pages).
      - "8000:8000"
    depends_on:
      - livekit
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Production mode (not dev): registers support-agent, takes dispatches.
    command: python agent/worker.py start
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      DATABASE_URL: sqlite:////data/app.db
      BACKEND_URL: http://backend:8000
    volumes:
      - ./data:/data
    depends_on:
      - livekit
      - backend
    restart: unless-stopped
  redis:
    # Job queue shared by the LiveKit server and the egress worker.
    image: redis:7-alpine
    restart: unless-stopped
  egress:
    # Recording worker (stretch: Egress to local disk). Needs SYS_ADMIN for
    # the bundled Chrome used by composite egress.
    image: livekit/egress:v1.8.4
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /out/egress.yaml
    volumes:
      - ./egress.yaml:/out/egress.yaml:ro
      # Recordings land here as <call-id>.mp3 (audio-only room composite).
      - ./recordings:/out/recordings
    depends_on:
      - livekit
      - redis
    restart: unless-stopped
# NOTE: Ollama runs natively (Ollama.app) on 11434 — no container here
# to avoid port clash. LLM = Ollama only (no OpenRouter code).
