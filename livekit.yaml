port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50010
  use_external_ip: false
room:
  empty_timeout: 300
  departure_timeout: 20
keys:
  devkey: devsecret-change-me-0123456789abcdef-LOCALONLY
turn:
  # Embedded TURN/UDP relay (also STUN). Browser/probes reach it via the
  # published 3478/udp on the API host, so relay candidates work even though
  # container IPs (172.x) are not routable from the Mac host (Docker Desktop).
  enabled: true
  udp_port: 3478
