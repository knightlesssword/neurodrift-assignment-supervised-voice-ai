port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50010
  use_external_ip: false
  # Advertised host-candidate IP. Must be reachable from browsers (via the
  # published UDP port mapping) and from compose containers (bridge gateway).
  # NOTE: Mac LAN IP — re-check with `ipconfig getifaddr en0` after network
  # changes. (Loopback was tried first for browsers, but in-container clients
  # such as the egress recorder resolve 127.0.0.1 to themselves.)
  node_ip: 10.125.170.205
  enable_loopback_candidate: true
room:
  empty_timeout: 300
  departure_timeout: 20
keys:
  devkey: devsecret-change-me-0123456789abcdef-LOCALONLY
# Shared Redis so the egress worker receives jobs from this server.
redis:
  address: redis:6379
turn:
  # Embedded TURN/UDP relay (also STUN). Browser/probes reach it via the
  # published 3478/udp on the API host, so relay candidates work even though
  # container IPs (172.x) are not routable from the Mac host (Docker Desktop).
  enabled: true
  udp_port: 3478
